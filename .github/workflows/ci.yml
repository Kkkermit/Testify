name: CI

on:
  # Every branch, so work is checked before a pull request exists.
  push:
    branches: ["**"]
  # A branch in this repository was checked when it was pushed, so only a fork's pull request runs here.
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only: nothing here writes to the repository.
permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, format
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Nothing here runs a binary an install script fetches.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # tsc re-checks everything a change can reach, so the state any earlier run left is safe to start from.
      - name: Restore the type checker's state
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/tsc
          key: tsc-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: tsc-${{ hashFiles('package-lock.json') }}-

      - name: Typecheck
        run: npm run typecheck

      # ESLint judges each file on its own while type-aware rules read others, so only an identical tree reuses results.
      - name: Restore lint results for an identical tree
        uses: actions/cache@v6
        with:
          path: node_modules/.cache/eslint
          key: eslint-${{ hashFiles('package-lock.json', '**/package.json', 'eslint.config.mjs', '**/tsconfig*.json', '**/*.ts', '**/*.tsx', '**/*.js', '**/*.mjs', '**/*.cjs', '!**/node_modules/**', '!**/dist/**', '!coverage/**') }}

      - name: Lint
        run: npm run lint -- --cache

      - name: Check formatting
        run: npm run format:check

  test:
    name: Tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    # Windows, because that is what most people clone this onto. Linux and macOS run every night.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # With its install scripts, so the volume test can run the real FFmpeg.
      - name: Install dependencies
        run: npm ci

      # The test MongoDB is fetched on the first run rather than at install, and kept here between runs.
      - name: Restore the test MongoDB
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: mongodb-${{ runner.os }}-

      - name: Run the bot's tests with coverage
        # Without this a run that could not start MongoDB would skip every database suite and still pass.
        env:
          REQUIRE_DB_TESTS: "1"
        run: npm run test:coverage:bot

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  dashboard-test:
    name: Dashboard tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The dashboard's tests touch no binary an install script fetches.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run the dashboard's tests with coverage
        run: npm run test:coverage:dashboard

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-dashboard
          path: dashboard/coverage/
          retention-days: 7

  build:
    name: Build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The build compiles and bundles; it runs nothing an install script fetches.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Verify assets reached dist/
        run: |
          test -d dist/assets   || { echo "dist/assets missing"; exit 1; }
          test -f dist/index.js || { echo "dist/index.js missing"; exit 1; }
          test -d dist/commands || { echo "dist/commands missing"; exit 1; }
          test -f dist/healthcheck.js || { echo "dist/healthcheck.js missing, which the image's HEALTHCHECK runs"; exit 1; }

      # tsc-alias rewrites the @-aliases in tsup's onSuccess; if it breaks, dist/ compiles and then fails to start.
      - name: Verify no unrewritten import aliases
        run: |
          if grep -rlE 'require\("@(core|lib|config|commands|events|buttons|menus|database|jobs|root|api)/' dist; then
            echo "dist/ still contains unrewritten aliases"; exit 1
          fi

      - name: Verify the dashboard was built
        run: |
          test -f dashboard/dist/index.html || { echo "dashboard/dist/index.html missing"; exit 1; }
          test -d dashboard/dist/assets     || { echo "dashboard/dist/assets missing"; exit 1; }

  audit:
    name: Dependency audit
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # An audit reads the lockfile; no install script has anything to add to it.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # better-npm-audit reads .nsprc, where each suppression has a reason and an expiry; bare `npm audit` ignores it.
      - name: Audit
        run: npm run audit
