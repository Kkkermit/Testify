name: CI

on:
  # Every branch, so work is checked before a pull request exists.
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  test:
    name: Tests
    # Windows, because that is what most people clone this onto. Linux and macOS run every night.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        # Without this a run that could not start MongoDB would skip every database suite and still pass.
        env:
          REQUIRE_DB_TESTS: "1"
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify assets reached dist/
        run: |
          test -d dist/assets   || { echo "dist/assets missing"; exit 1; }
          test -f dist/index.js || { echo "dist/index.js missing"; exit 1; }
          test -d dist/commands || { echo "dist/commands missing"; exit 1; }

      # tsc-alias rewrites the @-aliases in tsup's onSuccess; if it breaks, dist/ compiles and then fails to start.
      - name: Verify no unrewritten import aliases
        run: |
          if grep -rlE 'require\("@(core|lib|config|commands|events|buttons|database|jobs|root|api)/' dist; then
            echo "dist/ still contains unrewritten aliases"; exit 1
          fi

      - name: Verify the dashboard was built
        run: |
          test -f dashboard/dist/index.html || { echo "dashboard/dist/index.html missing"; exit 1; }
          test -d dashboard/dist/assets     || { echo "dashboard/dist/assets missing"; exit 1; }

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # better-npm-audit reads .nsprc, where each suppression has a reason and an expiry; bare `npm audit` ignores it.
      - name: Audit
        run: npm run audit
