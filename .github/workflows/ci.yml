name: CI

on:
  # Every branch, so work is checked before a pull request exists.
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # .nvmrc is the single source of truth for the Node version.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # .nvmrc is the single source of truth for the Node version.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # .nvmrc is the single source of truth for the Node version.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify assets reached dist/
        run: |
          test -d dist/assets   || { echo "dist/assets missing"; exit 1; }
          test -f dist/index.js || { echo "dist/index.js missing"; exit 1; }
          test -d dist/commands || { echo "dist/commands missing"; exit 1; }

      # esbuild does not rewrite @-aliases (tsup runs with bundle: false); tsc-alias does, in
      # onSuccess. If that step ever breaks, dist/ compiles and then fails to start.
      - name: Verify no unrewritten import aliases
        run: |
          if grep -rlE 'require\("@(core|lib|config|commands|events|buttons|database|jobs|root|api)/' dist; then
            echo "dist/ still contains unrewritten aliases"; exit 1
          fi

      - name: Verify the dashboard was built
        run: |
          test -f dashboard/dist/index.html || { echo "dashboard/dist/index.html missing"; exit 1; }
          test -d dashboard/dist/assets     || { echo "dashboard/dist/assets missing"; exit 1; }

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # .nvmrc is the single source of truth for the Node version.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run audit` and not bare `npm audit`: better-npm-audit reads .nsprc, where every suppression
      # carries a reason, the version that fixes it and a hard expiry. Bare `npm audit` ignores that file,
      # so this job used to fail on an advisory the repository had already ruled on.
      - name: Audit
        run: npm run audit
