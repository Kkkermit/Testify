name: Bug report
description: Something is not working as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not report security issues here — see SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `/command …`
        2. …
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: Command
      placeholder: /balance

  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [Slash command, Prefix command, Component (button or menu), Not command-related]
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: v22.11.0
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Testify version or commit
      placeholder: 2.0.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Redact tokens and connection strings before pasting.
      render: shell
