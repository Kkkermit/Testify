# Runs the image published from main instead of building one from this checkout.
#
#   docker compose -f docker-compose.yml -f docker-compose.image.yml up -d
#
# Set TESTIFY_TAG to pin a release, such as 2.3.5; it follows the newest release when unset.

services:
  bot:
    build: !reset null
    image: ghcr.io/kkkermit/testify:${TESTIFY_TAG:-latest}
    pull_policy: always
