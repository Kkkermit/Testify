<!doctype html>
<html lang="en-GB">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Testify Channels</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=Fira+Mono&family=Rubik:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
		<script src="https://cdn.jsdelivr.net/npm/motion@14.3.0/dist/motion.js"></script>
		<style type="text/tailwindcss">
			/* Direction I, channels: the server's own channel list is the navigation, and a feature is placed by dropping it on a channel. */
			@theme {
				--color-ground: #f2f3f6;
				--color-side: #e7e9ee;
				--color-paper: #ffffff;
				--color-ink: #1b1e24;
				--color-muted: #565d6b;
				--color-line: #d9dde4;
				--color-accent: #8a2a6b;
				--color-accent-wash: #f6e9f2;
				--color-ok: #1f7a52;
				--color-mention-ink: #3b48b8;
				--color-mention-wash: #e6e9fb;
				--font-body: "Rubik", system-ui, sans-serif;
				--font-mono: "Fira Mono", ui-monospace, monospace;
			}
			/* Inside a layer, so Tailwind's utilities can still override these. */
			@layer components {
				:root {
					color-scheme: light;
				}
				body {
					background: var(--color-ground);
					color: var(--color-ink);
					font-family: var(--font-body);
					margin: 0;
				}
				:focus-visible {
					outline: 2px solid var(--color-accent);
					outline-offset: 2px;
				}
				.chan {
					display: flex;
					align-items: center;
					gap: 8px;
					padding: 6px 10px;
					border-radius: 8px;
					color: var(--color-muted);
					text-decoration: none;
					font-size: 15px;
				}
				.chan:hover {
					background: rgb(27 30 36 / 0.06);
					color: var(--color-ink);
				}
				.chan[aria-current] {
					background: var(--color-paper);
					color: var(--color-ink);
					font-weight: 500;
				}
				.chan.busy {
					color: var(--color-ink);
				}
				.chan .count {
					margin-left: auto;
					min-width: 20px;
					height: 20px;
					padding: 0 6px;
					border-radius: 10px;
					background: var(--color-accent-wash);
					color: var(--color-accent);
					font-size: 12px;
					font-weight: 600;
					display: grid;
					place-items: center;
				}
				.chan.target {
					background: var(--color-accent-wash);
					color: var(--color-accent);
					box-shadow: inset 0 0 0 2px var(--color-accent);
				}
				.chip {
					display: flex;
					align-items: center;
					gap: 10px;
					padding: 10px 12px;
					border-radius: 12px;
					background: var(--color-paper);
					border: 1px solid var(--color-line);
					touch-action: none;
					cursor: grab;
					user-select: none;
				}
				.chip .grip {
					color: #8b93a1;
					letter-spacing: -2px;
					font-weight: 600;
				}
				.mention {
					color: var(--color-mention-ink);
					background: var(--color-mention-wash);
					border-radius: 3px;
					padding: 0 2px;
				}
				.switch {
					position: relative;
					flex: none;
					width: 40px;
					height: 24px;
					border-radius: 12px;
					background: #858c98;
				}
				.switch[aria-checked="true"] {
					background: var(--color-ok);
				}
				.switch .knob {
					position: absolute;
					top: 3px;
					left: 3px;
					width: 18px;
					height: 18px;
					border-radius: 50%;
					background: #fff;
					box-shadow: 0 1px 2px rgb(0 0 0 / 0.25);
				}
			}
		</style>
	</head>
	<body>
		<div id="app" class="flex h-dvh flex-col">
			<header class="border-line bg-paper flex h-14 shrink-0 items-center gap-3 border-b px-4 sm:px-6">
				<a href="#home" class="flex items-center gap-2 font-semibold">
					<span class="bg-ink grid size-7 place-items-center rounded-lg text-[13px] text-white">T</span
					><span class="max-sm:hidden">Testify</span>
				</a>
				<button
					type="button"
					class="border-line flex items-center gap-2 rounded-lg border px-2.5 py-1 text-sm font-medium"
				>
					<span class="grid size-5 place-items-center rounded bg-[#2e7d5b] text-[9px] font-semibold text-white">TH</span
					>Testify HQ <span class="text-muted" aria-hidden="true">⌄</span>
				</button>
				<button type="button" class="text-muted ml-auto text-sm">Search</button>
				<span
					class="grid size-8 place-items-center rounded-full bg-[#5b6170] text-sm font-semibold text-white"
					aria-label="Signed in as kkk"
					>K</span
				>
			</header>

			<div class="flex min-h-0 flex-1">
				<nav
					id="side"
					aria-label="Channels in Testify HQ"
					class="bg-side w-72 shrink-0 overflow-y-auto p-3 max-lg:hidden"
				></nav>

				<main id="main" class="min-w-0 flex-1 overflow-y-auto">
					<section data-view="home" class="mx-auto max-w-3xl px-4 py-10 sm:px-8">
						<h1 class="text-[32px] leading-tight font-semibold tracking-tight">Testify HQ</h1>
						<p id="summary" class="text-muted mt-2 max-w-[60ch] text-lg"></p>

						<h2 class="mt-10 font-semibold">Waiting for a channel</h2>
						<p class="text-muted mt-1 text-sm">Drag one onto a channel to start it there, or use Place in.</p>
						<ul id="waiting" class="mt-3 grid gap-2 sm:grid-cols-2"></ul>

						<h2 class="mt-10 font-semibold">Where Testify works</h2>
						<ul id="working" class="divide-line border-line mt-2 divide-y border-y"></ul>

						<div class="mt-10 lg:hidden">
							<h2 class="font-semibold">Your channels</h2>
							<div id="side-phone" class="bg-side mt-2 rounded-xl p-2"></div>
						</div>
					</section>

					<section data-view="channel" class="mx-auto max-w-3xl px-4 py-8 sm:px-8" hidden>
						<a href="#home" class="text-accent mb-4 inline-block text-sm font-medium lg:hidden">‹ Channels</a>
						<div class="flex items-baseline gap-3">
							<h1 class="text-[28px] font-semibold">
								<span class="text-muted font-normal">#</span><span id="ch-name"></span>
							</h1>
							<p id="ch-topic" class="text-muted min-w-0 truncate"></p>
						</div>
						<div id="ch-body" class="mt-6 grid gap-6"></div>
					</section>
				</main>
			</div>
		</div>

		<div
			id="menu"
			class="bg-paper border-line absolute z-50 w-56 rounded-xl border p-1.5 shadow-[0_18px_40px_-14px_rgb(27_30_36/0.35)]"
			role="menu"
			hidden
		></div>

		<script>
			const { animate, stagger } = Motion;
			const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
			const springy = { type: "spring", bounce: 0.2, visualDuration: 0.35 };
			const play = (el, keyframes, options = {}) =>
				animate(el, keyframes, calm ? { duration: 0 } : { ...springy, ...options });
			const $ = (selector) => document.querySelector(selector);
			const esc = (value) =>
				value.replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);

			const CATEGORIES = [
				{ name: "Information", channels: ["welcome", "rules", "roles"] },
				{ name: "Chat", channels: ["general", "memes", "art"] },
				{ name: "Support", channels: ["support", "ticket-logs"] },
			];
			const TOPICS = {
				welcome: "Where new members land",
				rules: "Read before posting",
				roles: "Pick your roles",
				general: "Talk about anything",
				memes: "Keep it light",
				art: "Show what you made",
				support: "Ask the staff",
				"ticket-logs": "Staff only",
			};
			const JOBS = {
				welcome: { name: "Welcome messages", does: "greets new members", channel: null },
				goodbye: { name: "Goodbye messages", does: "says goodbye, without pinging", channel: null },
				starboard: { name: "Starboard", does: "reposts messages with 3 stars", channel: null },
				birthdays: { name: "Birthdays", does: "wishes members happy birthday", channel: null },
				levels: { name: "Level-up announcements", does: "announces level-ups", channel: "general" },
				replies: { name: "2 auto-replies", does: "answers “rules” and “invite”", channel: "general" },
				tickets: { name: "Ticket panel", does: "opens a private ticket when somebody asks", channel: "support" },
				transcripts: {
					name: "Ticket transcripts",
					does: "keeps a copy of every closed ticket",
					channel: "ticket-logs",
				},
			};
			const state = {
				greet: true,
				card: true,
				message: "Welcome to {server}, {user}! Grab some roles in #roles and say hi.",
			};
			const ALL_CHANNELS = CATEGORIES.flatMap((c) => c.channels);
			const jobsIn = (channel) => Object.entries(JOBS).filter(([, job]) => job.channel === channel);

			function sideHtml(current) {
				const home = `<a class="chan" href="#home" data-home ${current === "home" ? 'aria-current="page"' : ""}><span aria-hidden="true">◎</span><span class="min-w-0 flex-1">Overview</span></a>`;
				const groups = CATEGORIES.map((cat) => {
					const rows = cat.channels
						.map((ch) => {
							const n = jobsIn(ch).length;
							return `<a class="chan${n ? " busy" : ""}" href="#${ch}" data-channel="${ch}" ${current === ch ? 'aria-current="page"' : ""}><span class="text-muted" aria-hidden="true">#</span><span class="min-w-0 flex-1 truncate">${ch}</span>${n ? `<span class="count" aria-label="${n} ${n === 1 ? "thing" : "things"} Testify does here">${n}</span>` : ""}</a>`;
						})
						.join("");
					return `<p class="text-muted mt-4 mb-1 px-2 text-xs font-semibold">${cat.name}</p>${rows}`;
				}).join("");
				const voice = `<p class="text-muted mt-4 mb-1 px-2 text-xs font-semibold">Voice</p><span class="chan opacity-80"><span aria-hidden="true">♪</span><span>Lounge</span></span><span class="chan opacity-80"><span aria-hidden="true">♪</span><span>Join to create</span><span class="text-muted ml-auto text-xs">Off</span></span>`;
				return home + groups + voice;
			}

			function homeHtml() {
				const placed = Object.values(JOBS).filter((j) => j.channel);
				const used = new Set(placed.map((j) => j.channel)).size;
				$("#summary").textContent =
					`Testify works in ${used} of your ${ALL_CHANNELS.length} text channels. Open a channel to see what it does there.`;
				$("#waiting").innerHTML =
					Object.entries(JOBS)
						.filter(([, j]) => !j.channel)
						.map(
							([key, j]) =>
								`<li class="chip" data-job="${key}"><span class="grip" aria-hidden="true">⋮⋮</span><span class="min-w-0 flex-1"><span class="block font-medium">${j.name}</span><span class="text-muted block text-sm">${j.does}</span></span><button type="button" class="border-line rounded-lg border px-2.5 py-1 text-sm" data-place="${key}" aria-haspopup="menu">Place in</button></li>`,
						)
						.join("") || `<li class="text-muted text-sm">Everything has a channel.</li>`;
				const byChannel = ALL_CHANNELS.filter((ch) => jobsIn(ch).length);
				$("#working").innerHTML = byChannel
					.map(
						(ch) =>
							`<li><a href="#${ch}" class="flex items-baseline gap-4 py-3"><span class="w-28 shrink-0 font-medium"><span class="text-muted">#</span>${ch}</span><span class="text-muted min-w-0 flex-1 text-sm">${jobsIn(
								ch,
							)
								.map(([, j]) => j.name)
								.join(" · ")}</span><span class="text-accent text-sm" aria-hidden="true">›</span></a></li>`,
					)
					.concat(
						`<li class="flex items-baseline gap-4 py-3"><span class="w-28 shrink-0 font-medium">Everywhere</span><span class="text-muted min-w-0 flex-1 text-sm">Warnings · Cases · Link filter is off</span></li>`,
					)
					.join("");
			}

			function fill(text) {
				return esc(text)
					.replaceAll("{user}", '<span class="mention">@Orbit</span>')
					.replaceAll("{server}", "Testify HQ")
					.replaceAll("{count}", "1,235")
					.replace(/#([a-z-]+)/g, '<span class="mention">#$1</span>');
			}
			const message = (body, extra = "") =>
				`<div class="flex gap-3"><span class="grid size-10 shrink-0 place-items-center rounded-full bg-[#7c5cd6] font-semibold text-white">T</span><div class="min-w-0 flex-1"><p class="text-[15px]"><span class="font-semibold">Testify</span> <span class="rounded-sm bg-[#5865c8] px-1 text-[10px] font-bold text-white">APP</span> <span class="text-muted text-xs">Today at 14:02</span></p>${body}${extra}</div></div>`;

			function jobBlock(key, channel) {
				const job = JOBS[key];
				const move = `<label class="text-muted ml-auto flex items-center gap-2 text-sm">Move to <select class="border-line bg-paper rounded-md border px-2 py-1 text-ink" data-move="${key}">${ALL_CHANNELS.map((c) => `<option ${c === channel ? "selected" : ""}>${c}</option>`).join("")}</select></label>`;
				let body = "";
				if (key === "welcome") {
					body =
						`<div class="text-muted mb-3 text-sm">→ <b class="text-ink font-medium">Orbit</b> joined the server · 14:02</div>` +
						message(
							`<div class="group relative mt-0.5"><p id="msg-view" class="cursor-text rounded-md text-[15px] leading-snug outline-offset-4 hover:bg-[var(--color-ground)]" tabindex="0" role="button" aria-label="Edit the welcome message">${fill(state.message)}</p><div id="msg-edit" hidden><textarea id="msg" rows="3" class="border-accent w-full resize-y rounded-lg border-2 p-2 text-[15px] focus-visible:outline-none">${esc(state.message)}</textarea><p class="text-muted mt-1 text-xs">{user} mentions them, {server} is the server’s name, {count} the member count. Press Escape when you’re done.</p></div><p class="text-muted mt-1 text-xs" id="msg-hint">Click the message to change it.</p></div>`,
							`<div id="card" class="mt-2 flex w-72 max-w-full items-center gap-3 rounded-lg bg-[#1d2a33] p-3 text-white" ${state.card ? "" : "hidden"}><span class="grid size-11 shrink-0 place-items-center rounded-full border-[3px] border-[#e8edf2] bg-[#4f7cac] font-bold">O</span><div><p class="text-[11px] text-[#b9c6d0]">Welcome to Testify HQ</p><p class="font-bold">Orbit</p><p class="text-[11px] text-[#b9c6d0]">Member #1,235</p></div></div>`,
						);
					body = `<div class="flex flex-wrap items-center gap-x-6 gap-y-2 border-b border-[var(--color-line)] px-5 py-3 text-sm"><label class="flex items-center gap-2">Greet new members <button class="switch" type="button" role="switch" aria-checked="${state.greet}" data-switch="greet" aria-label="Greet new members"><span class="knob"></span></button></label><label class="flex items-center gap-2">Picture card <button class="switch" type="button" role="switch" aria-checked="${state.card}" data-switch="card" aria-label="Picture card"><span class="knob"></span></button></label>${move}</div><div class="p-5">${body}</div>`;
				} else if (key === "levels") {
					body = `<div class="flex items-center border-b border-[var(--color-line)] px-5 py-3 text-sm"><span>Announced as they happen</span>${move}</div><div class="p-5">${message(`<p class="mt-0.5 text-[15px]">GG <span class="mention">@Orbit</span>, you just reached <b>level 10</b>!</p>`)}</div>`;
				} else if (key === "tickets") {
					body = `<div class="flex items-center border-b border-[var(--color-line)] px-5 py-3 text-sm"><span>The panel members press</span>${move}</div><div class="p-5">${message(`<div class="mt-1 max-w-md rounded-md border-l-4 border-[#4b8f6f] bg-[var(--color-ground)] p-3"><p class="font-semibold">Need a hand?</p><p class="text-muted text-sm">Press the button and the staff will see a private ticket.</p></div><span class="mt-2 inline-block rounded-md bg-[#4e5058] px-3 py-1 text-sm font-medium text-white">Open a ticket</span>`)}</div>`;
				} else {
					body = `<div class="flex items-center px-5 py-3 text-sm"><span>Testify ${job.does}.</span>${move}</div>`;
				}
				return `<article class="bg-paper border-line overflow-hidden rounded-2xl border" data-block="${key}"><h2 class="px-5 pt-4 font-semibold">${job.name}</h2>${body}</article>`;
			}

			function channelHtml(channel) {
				const jobs = jobsIn(channel);
				if (!jobs.length) {
					const waiting = Object.entries(JOBS).filter(([, j]) => !j.channel);
					return `<div class="border-line rounded-2xl border border-dashed p-8 text-center"><p class="font-medium">Testify doesn’t do anything in #${channel}.</p><p class="text-muted mt-1 text-sm">Start something here:</p><div class="mt-4 flex flex-wrap justify-center gap-2">${waiting.map(([key, j]) => `<button type="button" class="border-line bg-paper rounded-full border px-3 py-1.5 text-sm" data-put="${key}" data-to="${channel}">${j.name}</button>`).join("")}</div></div>`;
				}
				return jobs.map(([key]) => jobBlock(key, channel)).join("");
			}

			function syncKnobs(animateIt) {
				for (const button of document.querySelectorAll("[data-switch]")) {
					const on = button.getAttribute("aria-checked") === "true";
					const knob = button.querySelector(".knob");
					if (animateIt === button) play(knob, { x: on ? 16 : 0 }, { bounce: 0.4 });
					else knob.style.transform = on ? "translateX(16px)" : "none";
				}
			}

			function route() {
				const name = location.hash.slice(1);
				return ALL_CHANNELS.includes(name) ? name : "home";
			}

			function render(animateView) {
				const current = route();
				$("#side").innerHTML = sideHtml(current);
				$("#side-phone").innerHTML = sideHtml(current);
				for (const section of document.querySelectorAll("[data-view]"))
					section.hidden = section.dataset.view !== (current === "home" ? "home" : "channel");
				if (current === "home") homeHtml();
				else {
					$("#ch-name").textContent = current;
					const jobs = jobsIn(current);
					$("#ch-topic").textContent = jobs.length
						? `${TOPICS[current]}. Here Testify ${jobs.map(([, j]) => j.does).join(", and ")}.`
						: TOPICS[current];
					$("#ch-body").innerHTML = channelHtml(current);
					syncKnobs(null);
				}
				if (animateView) {
					const view = document.querySelector(`[data-view="${current === "home" ? "home" : "channel"}"]`);
					play(view, { opacity: [0, 1], y: [8, 0] });
					if (current !== "home")
						play(view.querySelectorAll("[data-block]"), { opacity: [0, 1], y: [12, 0] }, { delay: stagger(0.06) });
				}
			}

			function bump(channel) {
				for (const row of document.querySelectorAll(`.chan[data-channel="${channel}"]`)) {
					play(row, { scale: [1, 1.04, 1] }, { type: "tween", duration: 0.4 });
					const count = row.querySelector(".count");
					if (count) play(count, { scale: [0.4, 1.25, 1] }, { type: "tween", duration: 0.45 });
				}
			}

			// Moves a job to a channel; the ghost flies to that channel's row before the lists redraw.
			async function place(key, channel, ghost) {
				const target = [...document.querySelectorAll(`.chan[data-channel="${channel}"]`)].find((el) => el.offsetParent);
				if (ghost && target) {
					const t = target.getBoundingClientRect();
					await play(
						ghost,
						{ left: `${t.left + 12}px`, top: `${t.top + t.height / 2 - 18}px`, scale: 0.35, opacity: 0.2 },
						{ bounce: 0, visualDuration: 0.35 },
					);
				}
				ghost?.remove();
				JOBS[key].channel = channel;
				render(false);
				bump(channel);
				if (key === "welcome") setTimeout(() => (location.hash = `#${channel}`), calm ? 0 : 450);
			}

			let drag = null;
			document.addEventListener("pointerdown", (e) => {
				const chip = e.target.closest(".chip");
				if (!chip || e.target.closest("button") || e.button !== 0) return;
				drag = { chip, key: chip.dataset.job, x: e.clientX, y: e.clientY, ghost: null, over: null };
			});
			document.addEventListener("pointermove", (e) => {
				if (!drag) return;
				if (!drag.ghost) {
					if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 5) return;
					const r = drag.chip.getBoundingClientRect();
					drag.dx = drag.x - r.left;
					drag.dy = drag.y - r.top;
					drag.ghost = drag.chip.cloneNode(true);
					Object.assign(drag.ghost.style, {
						position: "fixed",
						left: `${r.left}px`,
						top: `${r.top}px`,
						width: `${r.width}px`,
						margin: 0,
						zIndex: 60,
						pointerEvents: "none",
						boxShadow: "0 20px 40px -16px rgb(27 30 36 / 0.45)",
						cursor: "grabbing",
					});
					document.body.append(drag.ghost);
					drag.chip.style.opacity = "0.35";
					play(drag.ghost, { rotate: [0, -2], scale: [1, 1.03] });
				}
				drag.ghost.style.left = `${e.clientX - drag.dx}px`;
				drag.ghost.style.top = `${e.clientY - drag.dy}px`;
				const over = document.elementFromPoint(e.clientX, e.clientY)?.closest(".chan[data-channel]") ?? null;
				if (over !== drag.over) {
					drag.over?.classList.remove("target");
					over?.classList.add("target");
					if (over) play(over, { scale: [1, 1.03] }, { bounce: 0.4 });
					if (drag.over) play(drag.over, { scale: 1 });
					drag.over = over;
				}
			});
			document.addEventListener("pointerup", async () => {
				if (!drag) return;
				const { chip, ghost, over, key } = drag;
				drag = null;
				if (!ghost) return;
				over?.classList.remove("target");
				if (over) return place(key, over.dataset.channel, ghost);
				const r = chip.getBoundingClientRect();
				await play(ghost, { left: `${r.left}px`, top: `${r.top}px`, rotate: 0, scale: 1 }, { bounce: 0.3 });
				ghost.remove();
				chip.style.opacity = "";
			});

			const menu = $("#menu");
			let menuFor = null;
			function openMenu(button) {
				menuFor = button;
				menu.innerHTML =
					`<p class="text-muted px-3 pt-1 pb-1 text-xs">Place ${esc(JOBS[button.dataset.place].name.toLowerCase())} in</p>` +
					ALL_CHANNELS.map(
						(c) =>
							`<button type="button" role="menuitem" class="hover:bg-ground focus-visible:bg-ground flex w-full rounded-lg px-3 py-1.5 text-left text-sm outline-none" data-pick="${c}"><span class="text-muted mr-1">#</span>${c}</button>`,
					).join("");
				menu.hidden = false;
				const r = button.getBoundingClientRect();
				menu.style.top = `${r.bottom + scrollY + 6}px`;
				menu.style.left = `${Math.min(r.right + scrollX - menu.offsetWidth, document.documentElement.clientWidth - menu.offsetWidth - 12)}px`;
				play(menu, { opacity: [0, 1], scale: [0.95, 1], y: [-4, 0] });
				menu.querySelector("[data-pick]").focus();
			}
			function closeMenu(focusBack) {
				if (menu.hidden) return;
				menu.hidden = true;
				if (focusBack) menuFor?.focus();
				menuFor = null;
			}

			document.addEventListener("click", (e) => {
				const placeButton = e.target.closest("[data-place]");
				if (placeButton) return menuFor === placeButton ? closeMenu(true) : openMenu(placeButton);
				const pick = e.target.closest("[data-pick]");
				if (pick && menuFor) {
					const key = menuFor.dataset.place;
					const chip = menuFor.closest(".chip");
					const r = chip.getBoundingClientRect();
					const ghost = chip.cloneNode(true);
					Object.assign(ghost.style, {
						position: "fixed",
						left: `${r.left}px`,
						top: `${r.top}px`,
						width: `${r.width}px`,
						margin: 0,
						zIndex: 60,
						pointerEvents: "none",
					});
					document.body.append(ghost);
					closeMenu(false);
					return place(key, pick.dataset.pick, ghost);
				}
				if (!e.target.closest("#menu")) closeMenu(false);
				const put = e.target.closest("[data-put]");
				if (put) return place(put.dataset.put, put.dataset.to, null);
				const sw = e.target.closest("[data-switch]");
				if (sw) {
					const on = sw.getAttribute("aria-checked") !== "true";
					sw.setAttribute("aria-checked", String(on));
					state[sw.dataset.switch] = on;
					syncKnobs(sw);
					if (sw.dataset.switch === "card") {
						const card = $("#card");
						if (on) {
							card.hidden = false;
							play(card, { opacity: [0, 1], y: [6, 0] });
						} else play(card, { opacity: 0 }, { type: "tween", duration: 0.15 }).then(() => (card.hidden = true));
					}
					return;
				}
				const view = e.target.closest("#msg-view");
				if (view) return editMessage(true);
			});
			document.addEventListener("keydown", (e) => {
				if (e.key === "Escape") {
					closeMenu(true);
					if (!$("#msg-edit")?.hidden) editMessage(false);
				}
				if ((e.key === "Enter" || e.key === " ") && e.target.id === "msg-view") {
					e.preventDefault();
					editMessage(true);
				}
				if (!menu.hidden && ["ArrowDown", "ArrowUp"].includes(e.key)) {
					e.preventDefault();
					const items = [...menu.querySelectorAll("[data-pick]")];
					const at = items.indexOf(document.activeElement);
					items[(at + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length].focus();
				}
			});
			document.addEventListener("change", (e) => {
				const move = e.target.closest("[data-move]");
				if (!move) return;
				const key = move.dataset.move;
				const block = document.querySelector(`[data-block="${key}"]`);
				play(block, { opacity: 0, x: -24 }, { type: "tween", duration: 0.2 }).then(() => {
					JOBS[key].channel = move.value;
					location.hash = `#${move.value}`;
					bump(move.value);
				});
			});
			document.addEventListener("input", (e) => {
				if (e.target.id !== "msg") return;
				state.message = e.target.value;
			});
			document.addEventListener("focusout", (e) => {
				if (e.target.id === "msg")
					setTimeout(
						() => !$("#msg-edit")?.hidden && !$("#msg-edit").contains(document.activeElement) && editMessage(false),
						0,
					);
			});

			// The message is its own editor: clicking it swaps in the text box, leaving it swaps the message back.
			function editMessage(open) {
				const view = $("#msg-view");
				const edit = $("#msg-edit");
				if (!view || !edit) return;
				if (open) {
					view.hidden = true;
					$("#msg-hint").hidden = true;
					edit.hidden = false;
					play(edit, { opacity: [0, 1], scale: [0.98, 1] });
					const area = $("#msg");
					area.focus();
					area.setSelectionRange(area.value.length, area.value.length);
				} else {
					edit.hidden = true;
					view.innerHTML = fill(state.message);
					view.hidden = false;
					$("#msg-hint").hidden = false;
					play(view, { backgroundColor: ["#e9ecf8", "rgb(233 236 248 / 0)"] }, { type: "tween", duration: 0.7 });
					view.focus();
				}
			}

			addEventListener("hashchange", () => {
				closeMenu(false);
				render(true);
				$("#main").scrollTo(0, 0);
			});
			if (location.hash === "#welcome") JOBS.welcome.channel = "welcome";
			render(false);
		</script>
	</body>
</html>
